name: Publish

on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  release:
    types:
      - published    # Run the workflow when a new GitHub release is published

# Two releases published in quick succession would otherwise race to push.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace }}/nuget

defaults:
  run:
    shell: pwsh

# Permissions are declared per job rather than once for the workflow, so each job carries its own.
# Nothing here writes through the GitHub token. There is no stored NuGet credential either: the
# publish job proves its identity to nuget.org with a GitHub OIDC token (Trusted Publishing) and is
# handed a key that lives for the length of the job. A job added below gets the repository default
# unless it says otherwise, so give it a permissions block too.
jobs:
  create_nuget:
    name: Create NuGet
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.x'

      # The published version comes from the release tag, so there is no version to bump by hand and
      # no way to release twice from the same number. A manual run has no tag and is a dry run: it
      # proves the package still builds, and the `publish` job below never runs for it.
      - name: Resolve the package version
        id: version
        run: |
          if ('${{ github.event_name }}' -eq 'release') {
            $version = '${{ github.event.release.tag_name }}' -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+([-+].*)?$') {
              throw "Release tag '${{ github.event.release.tag_name }}' is not a version NuGet can publish."
            }
          } else {
            $version = '0.0.0-dryrun'
          }
          Write-Host "Packing $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # Only the library is packed. Packing the solution would also produce a package for the
      # benchmark project, and the push step below would send it to nuget.org, where a published
      # package can be unlisted but never removed.
      - name: Build the library and generate the NuGet package
        run: >
          dotnet pack EfCore.BulkOperations/EfCore.BulkOperations.csproj
          --configuration Release
          -p:Version=${{ steps.version.outputs.version }}
          --output ${{ env.NuGetDirectory }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.NuGetDirectory }}/*.nupkg

  run_test:
    name: Run Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.x'
      - name: Run tests
        run: dotnet test --configuration Release

  publish:
    name: Publish NuGet
    # The nuget.org trusted-publishing policy is bound to this repository, this workflow file and
    # the `production` environment. All three must match or the login step is refused, so renaming
    # the file or the environment means editing the policy at nuget.org/account/trustedpublishing.
    environment: production
    permissions:
      contents: read
      id-token: write # lets the job request the OIDC token that NuGet/login exchanges for a key
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ create_nuget, run_test ]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.x'

      # Exchanges the job's OIDC token for a temporary nuget.org API key. NUGET_USER is a variable
      # on the `production` environment (Settings > Environments > production) holding the nuget.org
      # account that owns the trusted-publishing policy - not a GitHub account, and not a secret.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # --skip-duplicate makes re-running a failed release harmless. It can no longer hide a
      # forgotten version bump, because the version is the tag.
      # The key reaches the script through the environment rather than being expanded into it:
      # an expanded secret becomes part of the command text, where a runner log or a shell error
      # can reproduce it.
      - name: Publish NuGet package
        env:
          NUGET_TOKEN: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key "$env:NUGET_TOKEN" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
