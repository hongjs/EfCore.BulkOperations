services:
  mysql-benchmark:
    # Pinned: the benchmark numbers in the README were measured against this version.
    image: mysql:8.0
    container_name: bulk-operation-benchmark
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - ./mysql:/var/lib/mysql:rw,delegated
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    command:
      # The benchmarks load millions of rows. With MySQL's 128 MB default the working set stops
      # fitting in the buffer pool at around 500k rows, and a multi-row INSERT of several thousand
      # rows then spends most of its time waiting on page flushes rather than on anything the
      # client did. Sizing the pool for the data set keeps the comparison about the client.
      # 2 GB was enough here; give the container more memory than this, or MySQL is OOM-killed.
      - --innodb-buffer-pool-size=2G
      - --max-allowed-packet=256M
