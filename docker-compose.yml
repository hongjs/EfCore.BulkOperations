services:
  mysql-benchmark:
    # Pinned: the benchmark numbers in the README were measured against this version.
    image: mysql:8.0
    container_name: bulk-operation-benchmark
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - ./mysql:/var/lib/mysql:rw,delegated
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    command:
      # The only setting here, and it is about disk retention rather than speed: a full run writes
      # and deletes tens of millions of rows, and a disk that fills mid-run takes the server down
      # along with the results. Everything else is MySQL's own default, so the numbers in the
      # README are the ones a stock server gives and the container asks for no extra memory.
      - --binlog-expire-logs-seconds=300
