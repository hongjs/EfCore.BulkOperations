services:
  mysql-benchmark:
    # Pinned: the benchmark numbers in the README were measured against this version.
    image: mysql:8.0
    container_name: bulk-operation-benchmark
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - ./mysql:/var/lib/mysql:rw,delegated
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    command:
      # MySQL's own defaults otherwise, so the numbers in the README are the ones a stock server
      # gives and the container needs no more memory than a stock server asks for.
      # Room for a large BatchSize: one statement carrying several thousand rows is a few MB.
      - --max-allowed-packet=256M
      # A full run writes and deletes tens of millions of rows. Binary logging stays on, but the
      # logs are expired quickly so a long run cannot fill the disk - a full disk takes MySQL down
      # mid-run, and the results with it.
      - --binlog-expire-logs-seconds=300
